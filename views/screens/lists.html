<section id="lists" hidden>
    <div class="lhead"><h2 id="listTitle">Anime List</h2><p class="sub" id="listCount"></p></div>
    <div class="ltools">
      <button class="mini" id="lSearchBtn">Search</button>
      <button class="mini" id="lFilterBtn">Filter</button>
      <button class="mini" id="lCustBtn">Customise</button>
      <button class="mini" id="lListsBtn">Custom lists</button>
    </div>
    <input id="listSearch" placeholder="Search this list" autocomplete="off" hidden>
    <p class="sub" id="listNote" hidden></p>
    <div class="srow" id="listStatus"></div>
    <div id="listBody"></div>
    <button class="go alt" id="listMore" hidden>Show more</button>
  </section>
