<div class="sheet" id="csheet" hidden>
  <div class="sheethead"><button class="mini" id="csBack">← Back</button><b>Customise list</b></div>
  <div class="q">List type</div>
  <div class="row" id="csLayout"><button class="chip" data-v="linear" aria-pressed="false">Linear</button><button class="chip" data-v="grid" aria-pressed="true">Grid</button><button class="chip" data-v="simplified" aria-pressed="false">Simplified</button><button class="chip" data-v="album" aria-pressed="false">Album</button></div>
  <div id="csColsBox">
    <div class="q">Columns (Grid and Album)</div>
    <div class="row" id="csCols"><button class="chip" data-v="2" aria-pressed="false">2</button><button class="chip" data-v="3" aria-pressed="true">3</button><button class="chip" data-v="4" aria-pressed="false">4</button></div>
  </div>
  <div class="q">Experience</div>
  <label class="chk"><input type="checkbox" id="csHideRating"> Hide ratings</label>
  <label class="chk"><input type="checkbox" id="csHideYear"> Hide release year</label>
  <button class="go alt" id="csReset" type="button" style="margin-top:22px">Reset to default</button>
</div>
