<div class="sheet" id="dsheet" hidden>
  <div class="sheethead"><button class="mini" id="dtBack">← Back</button><b id="dtHead"></b><button class="mini" id="dtShare">Share</button></div>
  <div class="dhero" id="dtHero"></div>
  <div class="dbar" id="dtBar"></div>
  <div class="dstars" id="dtStars"></div>
  <p class="sub" id="dtMsg"></p>
  <div class="card" id="dtMore" hidden>
    <label for="dtList">Add to custom list</label>
    <div class="two"><select id="dtList"></select><button class="go" id="dtAddList">Add</button></div>
  </div>
  <p id="dtOverview"></p>
  <div id="dtShowBox" hidden>
    <h3 class="sec">Episodes</h3>
    <div class="chips" id="dtSeasons"></div>
    <div id="dtEpisodes"></div>
  </div>
  <h3 class="sec">Actors</h3>
  <div class="hrow" id="dtCast"></div>
  <h3 class="sec">Reviews</h3>
  <div class="chips" id="dtRevKinds">
    <button class="chip" data-k="likes" aria-pressed="true">Popular</button>
    <button class="chip" data-k="newest" aria-pressed="false">Recent</button>
  </div>
  <div class="hrow" id="dtReviews"></div>
  <h3 class="sec">Related</h3>
  <div class="hrow" id="dtRelated"></div>
  <h3 class="sec">Popular Lists</h3>
  <div class="hrow" id="dtLists"></div>
  <h3 class="sec">Details</h3>
  <div class="card" id="dtDetails"></div>
</div>
